<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register – MyCoffee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../asset/css/login.css" />
  </head>

  <body>
    <div class="login-page">

      <!-- Left panel -->
      <div class="login-panel-left">
        <div class="left-overlay">
          <a href="./index.html" class="brand-logo">
            <img src="../asset/image/logo.png" alt="MyCoffee logo" />
          </a>
          <div class="left-content">
            <h2>Join our coffee<br>community ☕</h2>
            <p>Create an account to track your orders, save favourites, and enjoy exclusive member perks.</p>
          </div>
        </div>
      </div>

      <!-- Right panel -->
      <div class="login-panel-right">
        <div class="form-card">
          <h1>Create Account</h1>
          <p class="form-subtitle">Already have an account? <a href="./login.html">Sign In</a></p>

          <form action="" id="login-form">

            <div class="field-group">
              <label for="email">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                Email address
              </label>
              <input type="text" name="email" id="email" placeholder="you@example.com" autocomplete="email" />
              <span class="field-error" id="email-error"></span>
            </div>

            <div class="field-group">
              <label for="password">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Password
              </label>
              <div class="input-wrapper">
                <input type="password" name="password" id="password" placeholder="••••••••" autocomplete="new-password" />
                <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">
                  <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <span class="field-error" id="pass1-error"></span>
            </div>

            <div class="field-group">
              <label for="repassword">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Confirm Password
              </label>
              <div class="input-wrapper">
                <input type="password" name="repassword" id="repassword" placeholder="••••••••" autocomplete="new-password" />
                <button type="button" class="toggle-pw" id="toggle-pw2" aria-label="Show confirm password">
                  <svg id="eye-icon2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <span class="field-error" id="pass2-error"></span>
            </div>

            <button type="submit" id="register-button">
              Create Account
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>

          </form>

          <a href="./index.html" class="back-home">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="15 18 9 12 15 6"/></svg>
            Back to Home
          </a>
        </div>
      </div>

    </div>

    <script type="module" src="../asset/js/firebase_config.js"></script>
    <script type="module" src="../asset/js/register.js"></script>
    <script>
      function bindToggle(btnId, inputId, iconId) {
        const btn = document.getElementById(btnId);
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (btn) {
          btn.addEventListener('click', () => {
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.style.opacity = show ? '0.4' : '1';
          });
        }
      }
      bindToggle('toggle-pw',  'password',   'eye-icon');
      bindToggle('toggle-pw2', 'repassword', 'eye-icon2');
    </script>
  </body>
</html>
