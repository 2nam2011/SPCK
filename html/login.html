<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – MyCoffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../asset/css/login.css" />
</head>

<body>
  <div class="login-page">

    <!-- Left panel -->
    <div class="login-panel-left">
      <div class="left-overlay">
        <a href="./index.html" class="brand-logo">
          <img src="../asset/image/logo.png" alt="MyCoffee logo" />
        </a>
        <div class="left-content">
          <h2>Welcome back,<br>coffee lover ☕</h2>
          <p>Sign in to access your orders, favourites, and exclusive member offers.</p>
        </div>
      </div>
    </div>

    <!-- Right panel -->
    <div class="login-panel-right">
      <div class="form-card">
        <h1>Sign In</h1>
        <p class="form-subtitle">Don't have an account? <a href="./register.html">Register</a></p>

        <form action="" id="login-form">

          <div class="field-group">
            <label for="email">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <polyline points="22,6 12,13 2,6" />
              </svg>
              Email address
            </label>
            <input type="text" name="email" id="email" placeholder="you@example.com" autocomplete="email" />
            <span class="field-error" id="email-error"></span>
          </div>

          <div class="field-group">
            <label for="password">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              Password
            </label>
            <div class="input-wrapper">
              <input type="password" name="password" id="password" placeholder="••••••••"
                autocomplete="current-password" />
              <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <span class="field-error" id="pass-error"></span>
          </div>

          <button type="submit" id="login-button">
            Sign In
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </button>

          <div class="divider"><span>or continue with</span></div>

          <button type="button" id="google-login-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20" height="20">
              <path fill="#FFC107"
                d="M43.6 20H24v8h11.3C33.6 33 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 20-8 20-20 0-1.3-.1-2.7-.4-4z" />
              <path fill="#FF3D00"
                d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z" />
              <path fill="#4CAF50"
                d="M24 44c5.2 0 10-1.9 13.7-5l-6.3-5.2C29.5 35.5 26.9 36 24 36c-5.3 0-9.6-3-11.3-7.4l-6.6 5.1C9.7 39.7 16.3 44 24 44z" />
              <path fill="#1976D2"
                d="M43.6 20H24v8h11.3c-.8 2.3-2.4 4.3-4.4 5.7l6.3 5.2C41.2 35.5 44 30.1 44 24c0-1.3-.1-2.7-.4-4z" />
            </svg>
            Sign in with Google
          </button>

        </form>

        <a href="./index.html" class="back-home">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
            <polyline points="15 18 9 12 15 6" />
          </svg>
          Back to Home
        </a>
      </div>
    </div>

  </div>

  <script type="module" src="../asset/js/firebase_config.js"></script>
  <script type="module" src="../asset/js/login.js"></script>
  <script>
    const toggleBtn = document.getElementById('toggle-pw');
    const pwInput = document.getElementById('password');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwInput.type === 'password';
        pwInput.type = isPassword ? 'text' : 'password';
        document.getElementById('eye-icon').style.opacity = isPassword ? '0.4' : '1';
      });
    }
  </script>
</body>

</html>
